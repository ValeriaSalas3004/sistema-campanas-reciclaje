spring.application.name=recycling-campaign-system

# TEMPORAL: H2 en memoria para pruebas en esta rama. Restaurar a Postgres
# (spring.datasource.url=${URL}, USERNAME, PASSWORD, driver postgresql) antes de mergear.
spring.datasource.url=jdbc:h2:mem:recycling_campaign_system;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
